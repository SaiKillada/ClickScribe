<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ClickScribe</title>
    <style>
      body {
        width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        color: #1f1f1f;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      #status {
        font-size: 12px;
        color: #5f6368;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      #toggleBtn {
        background: #1a73e8;
        color: white;
        font-weight: 600;
      }
      #toggleBtn.recording {
        background: #d93025;
      }
      #downloadBtn {
        background: #f1f3f4;
        color: #1f1f1f;
      }
      #clearBtn {
        background: transparent;
        color: #5f6368;
        text-decoration: underline;
        margin-bottom: 0;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #count {
        font-size: 12px;
        color: #5f6368;
        margin: 8px 0;
        text-align: center;
      }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 11px;
        color: #5f6368;
        margin: 10px 0;
      }
      .option input {
        width: auto;
        margin: 2px 0 0;
      }
      .field {
        margin: 10px 0;
      }
      .field label {
        display: block;
        font-size: 11px;
        color: #5f6368;
        margin-bottom: 4px;
      }
      .field select {
        width: 100%;
        padding: 6px;
        font-size: 12px;
        border-radius: 6px;
        border: 1px solid #dadce0;
        background: white;
        color: #1f1f1f;
      }
    </style>
  </head>
  <body>
    <h1>ClickScribe</h1>
    <div id="status">Not recording</div>
    <button id="toggleBtn">Start Recording</button>
    <label class="option">
      <input type="checkbox" id="skipEmptyClicksToggle" />
      <span>Skip clicks on empty space (only capture clicks on links, buttons, and other interactive elements)</span>
    </label>
    <div class="field">
      <label for="highlightStyleSelect">Click highlight border</label>
      <select id="highlightStyleSelect">
        <option value="none">None (no border)</option>
        <option value="dashed">Dashed</option>
        <option value="dotted">Dotted</option>
        <option value="solid">Solid</option>
        <option value="solid-yellow">Solid (Yellow)</option>
        <option value="double">Double</option>
      </select>
    </div>
    <div class="field">
      <label for="screenshotFrameSelect">Screenshot frame</label>
      <select id="screenshotFrameSelect">
        <option value="none">None</option>
        <option value="shadow">Soft Shadow</option>
        <option value="elevated">Elevated Card</option>
        <option value="rounded">Rounded (Subtle Shadow)</option>
        <option value="border">Thin Border</option>
        <option value="polaroid">Polaroid</option>
      </select>
    </div>
    <div id="count">0 screenshot(s) captured</div>
    <button id="downloadBtn" disabled>Download as Word Document</button>
    <button id="zipBtn" disabled>Download as ZIP</button>
    <button id="clearBtn" disabled>Clear screenshots</button>
    <script src="zip.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
